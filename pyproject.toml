[project]
name = "accidents-prediction"
version = "1.0.0"
description = "Prédiction de la gravité des accidents routiers"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.1",
    "uvicorn>=0.24.0",
    "streamlit>=1.29.0",
    "pandas>=2.1.3",
    "scikit-learn>=1.5.1",
    "joblib>=1.3.2",
    "requests>=2.31.0",
]

[dependency-groups]
dev = [
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "pytest>=7.4.0",
    "types-requests>=2.32.4.20260107",
    "pandas-stubs>=3.0.0.260204",
    "httpx>=0.28.1",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]

ignore = ["E501"] #rajout après 100500 corrections des lignes soit disant trop longues 

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_return_any = true 
warn_unused_configs = true

[[tool.mypy.overrides]]
module = "joblib"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "--strict-markers"
